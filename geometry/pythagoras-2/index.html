<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>畢氏定理的數值探索</title>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    @font-face {
        font-family: 'jf-open-huninn';
        src: url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.woff') format('woff'),
             url('https://cdn.jsdelivr.net/gh/marsnow/open-huninn-font@1.1/font/jf-openhuninn.ttf') format('truetype');
        font-weight: normal; font-style: normal; font-display: swap;
    }

        :root {
            --tx-canvas:#F7F4EA; --tx-surface:#FFFDF7; --tx-ink:#30312D;
            --tx-text-muted:#666861; --tx-border:#DDD8CA;
            --tx-action:#3F91A7; --tx-action-strong:#2F7183;
            --tx-success:#52765E; --tx-hint:#F4CF57; --tx-alert:#A84F35;
            --tx-action-soft:#E4F0F3; --tx-success-soft:#E9EEE7;
            --tx-hint-soft:#FFF5CF; --tx-alert-soft:#F4E6E0;
            --tx-radius-control:8px; --tx-radius-button:12px;
            --tx-radius-panel:16px; --tx-radius-canvas:20px;
            --tx-shadow-float:0 8px 24px rgba(48,49,45,0.10);
            --tx-font-brand:"Huninn","jf-open-huninn","PingFang TC","Microsoft JhengHei",sans-serif;
            --tx-font-ui:"Noto Sans TC","Source Han Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
            --tx-font-narrative:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
        }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin:0; height:100%; }
    body {
        background-color:#F7F4EA;
        font-family:var(--tx-font-ui);
        color:#3F91A7; letter-spacing:.05em;
    }

    /* ── 選單畫面 ── */
    #menu-view {
        min-height:100%; display:flex; align-items:center; justify-content:center;
    }
    .wrap { width:100%; max-width:900px; padding:24px; text-align:center; }
    h1 {
        font-size:clamp(28px,3.8vw,40px); font-weight:bold; margin-bottom:6px;
        text-shadow:1px 1px 2px rgba(0,0,0,.05);
    }
    .subtitle { color:#666861; font-size:clamp(16px,1.7vw,20px); margin-bottom:36px; }
    .sub-heading { color:#3F91A7; font-size:clamp(18px,1.8vw,22px); font-weight:bold; margin-bottom:14px; }
    .cards { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
    .card {
        flex:1 1 320px; max-width:360px;
        background:var(--tx-surface); border-radius:var(--tx-radius-panel); padding:28px 24px;
        box-shadow:var(--tx-shadow-float);
        text-decoration:none; color:inherit;
        display:flex; flex-direction:column; align-items:center;
        transition:transform .2s ease, box-shadow .2s ease;
        border:2px solid transparent; cursor:pointer;
        font-family:inherit;
    }
    .card:hover { transform:translateY(-4px); box-shadow:0 10px 30px rgba(48,49,45,.16); border-color:#3F91A7; }
    .card-icon {
        width:60px; height:60px;
        display:flex; align-items:center; justify-content:center;
        margin-bottom:16px; position:relative; overflow:visible;
    }
    .card-icon img { width:104px; height:104px; object-fit:contain; position:relative; z-index:1; }
    .icon-guided, .icon-free { background:none; }
    .card-title { font-size:clamp(20px,2.1vw,24px); font-weight:bold; color:#2F7183; margin-bottom:6px; }
    .card-desc { font-size:clamp(15px,1.4vw,17px); color:#666861; line-height:1.7; margin-bottom:18px; }
    .card-tagline { font-size:clamp(15px,1.4vw,17px); color:#2F7183; font-weight:bold; margin-bottom:8px; }
    .card-tag {
        font-size:14.5px; font-weight:bold; letter-spacing:.08em;
        padding:5px 14px; border-radius:999px;
    }
    .tag-guided { background:#3F91A7; color:#fff; }
    .tag-free   { background:#30312D; color:#fff; }

    /* ── 教具畫面 ── */
    #app-view {
        display:none; position:relative; width:100%; height:100%; overflow:hidden;
    }
    #app-frame {
        width:100%; height:100%; border:none; display:block;
    }
    #float-back {
        background:none; border:none; color:#666861;
        padding:4px 6px; font-family:var(--tx-font-brand); font-size:14px; font-weight:normal;
        cursor:pointer; text-shadow:0 1px 3px rgba(255,255,255,.8);
        transition:color .2s;
    }
    #float-back:hover, #float-back:focus-visible { color:#3F91A7; }

    #back-bar {
        position:absolute; top:12px; left:16px; z-index:10;
        display:flex; align-items:center; gap:14px;
    }
    #back-bar #brand-logo-icon {
        width:26px; height:26px; opacity:.85; pointer-events:none; user-select:none; flex-shrink:0;
    }
    #brand-mark {
        position:absolute; top:16px; left:18px; z-index:10;
        display:flex; align-items:center; gap:10px;
    }
    #brand-mark-icon {
        width:34px; height:34px; opacity:.9; pointer-events:none; user-select:none; flex-shrink:0;
    }
    #brand-mark span {
        font-family:var(--tx-font-brand); font-size:20px; font-weight:bold;
        color:#666666; letter-spacing:.08em; opacity:.9;
    }

        h1, .card-title, .card-tag, .sub-heading, .subtitle { font-family:var(--tx-font-brand); }
    </style>
</head>

function b64DecodeUnicode(str) {
    return decodeURIComponent(
        atob(str).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join('')
    );
}

function openApp(which){
    const html = which === 'guided' ? b64DecodeUnicode(PYTHAGORAS_B64) : b64DecodeUnicode(FREEPLAY_B64);
    document.getElementById('app-frame').srcdoc = html;
    document.getElementById('menu-view').style.display = 'none';
    document.getElementById('app-view').style.display = 'block';
}

function showMenu(){
    document.getElementById('app-view').style.display = 'none';
    document.getElementById('menu-view').style.display = 'flex';
    document.getElementById('app-frame').srcdoc = '';
}
